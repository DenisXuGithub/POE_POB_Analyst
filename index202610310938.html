<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 真‧動態自動解析器</title>
  <!-- 載入 pako.js 用於前端解壓縮 PoB zlib 代碼 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0d10;
      color: #e1e4e8;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0a334; margin-bottom: 5px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; text-align: center; }
    .input-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px 16px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
    }
    textarea:focus { border-color: #f0a334; outline: none; }
    button {
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      align-self: flex-end;
    }
    button:hover { background-color: #2ea043; }
    .analysis-result {
      width: 100%;
      max-width: 900px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 25px;
      box-sizing: border-box;
      line-height: 1.6;
      display: none;
    }
    .analysis-result h3 { color: #58a6ff; margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
    .analysis-result h4 { color: #f0a334; margin-top: 20px; margin-bottom: 8px; }
    .analysis-result ul { padding-left: 20px; margin-top: 5px; }
    .analysis-result li { margin-bottom: 8px; }
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; font-size: 13px; color: #f0a334; }
  </style>
</head>
<body>

  <h2>Path of Building 自動動態解析器</h2>
  <p class="subtitle">貼上任何 PoB 碼，網頁將自動解壓 XML 數據並生成專屬分析！</p>

  <div class="input-container">
    <textarea id="pobCodeInput" placeholder="在此貼上任何 PoB 匯出碼 (eJz...)"></textarea>
    <button onclick="parseAndAnalyzePoB()">解析此 PoB</button>
  </div>

  <div class="analysis-result" id="resultBox">
    <h3 id="buildTitle">解析報告</h3>
    <div id="buildMeta"></div>
    <hr style="border: 0; border-top: 1px solid #30363d; margin: 15px 0;">
    <div id="buildAnalysis"></div>
  </div>

  <script>
    function parseAndAnalyzePoB() {
      const rawCode = document.getElementById('pobCodeInput').value.trim();
      const resultBox = document.getElementById('resultBox');

      if (!rawCode) {
        alert('請先輸入 PoB 代碼！');
        return;
      }

      try {
        // 1. 將 URL-Safe Base64 轉為標準 Base64
        let base64 = rawCode.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        // 2. Base64 解碼為 Uint8Array
        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        // 3. 使用 pako.js 進行 zlib 解壓縮
        const decompressed = pako.inflate(bytes, { to: 'string' });

        // 4. 解析回傳的 XML
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        // 提取 XML 中的實際角色數據
        const buildNode = xmlDoc.querySelector("Build");
        const className = buildNode ? buildNode.getAttribute("className") : "未知職業";
        const ascendClassName = buildNode ? buildNode.getAttribute("ascendClassName") : "";
        const level = buildNode ? buildNode.getAttribute("level") : "未知";

        // 提取技能數據
        const skillGems = Array.from(xmlDoc.querySelectorAll("Gem"))
          .map(gem => gem.getAttribute("nameSpec"))
          .filter(Boolean);

        // 渲染專屬解析報告
        document.getElementById('buildTitle').innerText = `機體即時解析：${level} 級 ${className} (${ascendClassName || '未昇華'})`;
        
        document.getElementById('buildMeta').innerHTML = `
          <span class="badge">主職業：${className}</span>
          <span class="badge">昇華：${ascendClassName || '無'}</span>
          <span class="badge">角色等級：${level}</span>
          <span class="badge">偵測寶石數量：${skillGems.length} 個</span>
        `;

        // 根據解開的職業進行動態條件分析
        let dynamicAnalysis = '';

        if (className === 'Witch' || className === '女巫') {
          dynamicAnalysis = `
            <h4>一、 女巫 (Witch) 核心機制診斷</h4>
            <ul>
              <li><strong>屬性導向：</strong> 智力為基礎主屬性。需確認能量護盾 (ES) 與魔力保留是否足夠。</li>
              <li><strong>流派方向：</strong> 若為法術或元素異常流派，需注意元素穿透與施法速度；若為召喚流，需檢視召喚物傷害與生存天賦。</li>
            </ul>
            <h4>二、 偵測到的核心技能串</h4>
            <ul>
              <li>${skillGems.length > 0 ? skillGems.slice(0, 6).join(' + ') : '未偵測到主要技能串'}</li>
            </ul>
          `;
        } else if (className === 'Ranger' || className === '遊俠') {
          dynamicAnalysis = `
            <h4>一、 遊俠 (Ranger) 核心機制診斷</h4>
            <ul>
              <li><strong>智力匱乏警訊：</strong> 右下角敏捷盤缺乏智力，必須嚴格控管藍色寶石等級，避免屬性不足卡死。</li>
              <li><strong>生存硬指標：</strong> 必須透過防具與天賦將法術壓抑撐滿至 100%，並搭配優雅光環維持高閃避。</li>
            </ul>
            <h4>二、 偵測到的核心技能串</h4>
            <ul>
              <li>${skillGems.length > 0 ? skillGems.slice(0, 6).join(' + ') : '未偵測到主要技能串'}</li>
            </ul>
          `;
        } else {
          dynamicAnalysis = `
            <h4>一、 機體基礎診斷 (${className})</h4>
            <ul>
              <li>已成功解開此 ${className} 之 XML 數據，等級為 ${level} 級。</li>
              <li>主要技能配置包括：${skillGems.slice(0, 5).join(', ')}...</li>
            </ul>
          `;
        }

        document.getElementById('buildAnalysis').innerHTML = dynamicAnalysis;
        resultBox.style.display = 'block';

      } catch (err) {
        console.error(err);
        alert('PoB 解碼失敗！請確認貼上的代碼是否完整且未夾帶多餘字元。');
      }
    }
  </script>

</body>
</html>
