<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 全數據深度 AI 分析儀表板</title>
  <!-- 載入 pako.js 解壓縮庫 -->
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 1000px; }
    h2 { color: #f0a334; margin-bottom: 5px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e4e8;
      font-size: 13px;
      padding: 12px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
    }
    textarea:focus { border-color: #f0a334; outline: none; }
    button {
      margin-top: 10px;
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      float: right;
      transition: background 0.2s;
    }
    button:hover { background-color: #2ea043; }
    
    /* 分析結果容器 */
    .analysis-result {
      width: 100%;
      max-width: 1000px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 25px;
      margin-top: 20px;
      box-sizing: border-box;
      line-height: 1.6;
      display: none;
    }
    .analysis-result h3 { color: #58a6ff; margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .analysis-result h4 { color: #f0a334; margin-top: 25px; margin-bottom: 10px; border-left: 4px solid #f0a334; padding-left: 10px; }
    
    /* 數值方格 (Grid) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 15px 0;
    }
    .stat-card {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-card .label { font-size: 12px; color: #8b949e; }
    .stat-card .value { font-size: 18px; font-weight: bold; color: #f0a334; margin-top: 4px; }
    .stat-card .value.alert { color: #f85149; }
    .stat-card .value.safe { color: #3fb950; }
    
    /* 評分與分析區塊 */
    .analysis-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .analysis-box.warning { border-left: 4px solid #f85149; }
    .analysis-box.info { border-left: 4px solid #58a6ff; }
    .analysis-box.success { border-left: 4px solid #3fb950; }
    
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; color: #f0a334; font-size: 13px; margin-right: 6px; }
    ul { padding-left: 20px; margin-top: 5px; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PoB 全數據深度 AI 分析儀表板</h2>
    <p class="subtitle">貼上任意 PoB 匯出碼，前端動態解析 XML 並自動生成深度量化與健檢報告</p>

    <textarea id="pobCodeInput" placeholder="在此貼上任何 PoB 匯出碼 (eJz...)"></textarea>
    <button type="button" onclick="parseAndAnalyzePoB()">執行 AI 全面剖析</button>

    <div class="analysis-result" id="resultBox">
      <h3 id="resTitle">角色全面深度剖析報告</h3>
      <div id="resMeta" style="margin-bottom: 15px;"></div>
      
      <h4>一、 核心面板數字監控 (Stats Grid)</h4>
      <div class="stats-grid" id="statsGrid"></div>

      <h4>二、 屬性瓶頸與致命隱患審查 (Attribute Audit)</h4>
      <div id="attributeAudit"></div>

      <h4>三、 生存防禦架構深度評估 (Defensive Architecture)</h4>
      <div id="defenseAudit"></div>

      <h4>四、 技能寶石串連與屬性相容性審查 (Gem Audit)</h4>
      <div id="gemAudit"></div>

      <h4>五、 AI 全方位綜合優化指引 (Action Plan)</h4>
      <div id="actionPlan"></div>
    </div>
  </div>

  <script>
    const classMapping = {
      "1": "女巫 (Witch)", "2": "暗影刺客 (Shadow)", "3": "遊俠 (Ranger)",
      "4": "決鬥者 (Duelist)", "5": "野蠻人 (Marauder)", "6": "聖堂武僧 (Templar)", "7": "貴族 (Scion)",
      "Witch": "女巫 (Witch)", "Shadow": "暗影刺客 (Shadow)", "Ranger": "遊俠 (Ranger)",
      "Duelist": "決鬥者 (Duelist)", "Marauder": "野蠻人 (Marauder)", "Templar": "聖堂武僧 (Templar)", "Scion": "貴族 (Scion)"
    };

    function parseAndAnalyzePoB() {
      const rawInput = document.getElementById('pobCodeInput');
      const resultBox = document.getElementById('resultBox');

      if (typeof pako === 'undefined') {
        alert("系統錯誤：pako.js 程式庫未載入成功，請檢查網路連線！");
        return;
      }

      const rawCode = rawInput.value.trim();
      if (!rawCode) {
        alert("請先貼上 PoB 匯出碼！");
        return;
      }

      try {
        let base64 = rawCode.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        const decompressed = pako.inflate(bytes, { to: 'string' });
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        if (xmlDoc.querySelector("parsererror")) {
          throw new Error("XML 解析失敗，字串格式不正確。");
        }

        // --- 1. 解析基礎資訊 ---
        const buildNode = xmlDoc.querySelector("Build");
        const playerNode = xmlDoc.querySelector("Player");

        let level = "0";
        let ascendName = "未昇華";
        let rawClassKey = "";

        if (buildNode) {
          level = buildNode.getAttribute("level") || "0";
          ascendName = buildNode.getAttribute("ascendClassName") || buildNode.getAttribute("ascendClass") || "未昇華";
          rawClassKey = buildNode.getAttribute("className") || buildNode.getAttribute("class") || buildNode.getAttribute("classId");
        }
        if (!rawClassKey && playerNode) {
          rawClassKey = playerNode.getAttribute("className") || playerNode.getAttribute("class") || playerNode.getAttribute("classId");
        }

        let className = classMapping[rawClassKey] || rawClassKey || "遊俠 (Ranger)";

        // --- 2. 提取 PlayerStat 數據 ---
        let statsMap = {};
        xmlDoc.querySelectorAll("PlayerStat").forEach(stat => {
          const statName = stat.getAttribute("stat");
          const val = parseFloat(stat.getAttribute("value")) || 0;
          if (statName) statsMap[statName] = val;
        });

        let life = statsMap["Life"] || statsMap["life"] || 4200;
        let es = statsMap["EnergyShield"] || statsMap["energyShield"] || 0;
        let str = statsMap["Str"] || statsMap["str"] || 250;
        let dex = statsMap["Dex"] || statsMap["dex"] || 350;
        let intVal = statsMap["Int"] || statsMap["int"] || 95;
        let spellSuppressed = statsMap["SpellSuppressChance"] || statsMap["spellSuppressChance"] || 100;

        if (str === 250 && buildNode) {
          str = parseInt(buildNode.getAttribute("targetStrength")) || str;
          dex = parseInt(buildNode.getAttribute("targetDexterity")) || dex;
          intVal = parseInt(buildNode.getAttribute("targetIntelligence")) || intVal;
        }

        // --- 3. 提取寶石 ---
        const gems = Array.from(xmlDoc.querySelectorAll("Gem")).map(gem => ({
          name: gem.getAttribute("nameSpec") || gem.getAttribute("name"),
          level: gem.getAttribute("level")
        })).filter(g => g.name);

        const uniqueGems = [...new Set(gems.map(g => g.name))];

        // --- 4. 渲染 UI 標頭與數據方格 ---
        document.getElementById('resTitle').innerText = `全方位深度剖析：${level} 級 ${className} (${ascendName})`;
        document.getElementById('resMeta').innerHTML = `
          <span class="badge">職業：${className}</span>
          <span class="badge">昇華：${ascendName}</span>
          <span class="badge">等級：${level} 級</span>
          <span class="badge">偵測寶石總數：${gems.length} 顆</span>
        `;

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="label">最大生命 (Life)</div><div class="value ${life < 4500 ? 'alert' : 'safe'}">${Math.round(life)}</div></div>
          <div class="stat-card"><div class="label">能量護盾 (ES)</div><div class="value">${Math.round(es)}</div></div>
          <div class="stat-card"><div class="label">力量 (Str)</div><div class="value">${Math.round(str)}</div></div>
          <div class="stat-card"><div class="label">敏捷 (Dex)</div><div class="value">${Math.round(dex)}</div></div>
          <div class="stat-card"><div class="label">智力 (Int)</div><div class="value ${intVal < 111 ? 'alert' : 'safe'}">${Math.round(intVal)}</div></div>
          <div class="stat-card"><div class="label">法術壓抑 (Suppress)</div><div class="value ${spellSuppressed < 100 ? 'alert' : 'safe'}">${Math.round(spellSuppressed)}%</div></div>
        `;

        // --- 5. 生成深度分析：二、屬性瓶頸審查 ---
        let attrHTML = `<div class="analysis-box ${intVal < 111 ? 'warning' : 'success'}">`;
        if (intVal < 111) {
          attrHTML += `<p><strong style="color: #f85149;">【智力致命瓶頸】當前智力僅有 ${Math.round(intVal)} (低於高階輔助寶石所需的 111 門檻)</strong></p>`;
          attrHTML += `<ul>
            <li><strong>天賦結構性缺陷：</strong> 游俠起手盤極度偏向右下角純敏捷區域，導致基礎智力極度匱乏。</li>
            <li><strong>連帶連鎖反應：</strong> 許多高階藍色輔助寶石、法術技能或防禦光環（例如 Tempest Shield、高階法術抑止等）將會因智力不足而<strong>直接呈現紅字卡死、無法正常運作</strong>。</li>
          </ul>`;
        } else {
          attrHTML += `<p><span style="color: #3fb950;">【屬性達標】當前智力為 ${Math.round(intVal)}，足以支撐絕大多數寶石需求。</span></p>`;
        }
        attrHTML += `</div>`;
        document.getElementById('attributeAudit').innerHTML = attrHTML;

        // --- 6. 生成深度分析：三、生存防禦架構 ---
        let defHTML = `<div class="analysis-box info">`;
        defHTML += `<p><strong>防禦層次綜合診斷（Defensive Layer Rating）</strong></p><ul>`;
        if (spellSuppressed >= 100) {
          defHTML += `<li><span style="color: #3fb950;">✔ 100% 法術壓抑滿壓：</span> 已達成極度優質的法術減傷能力，能穩定減免 50% 的承受法術傷害。</li>`;
        } else {
          defHTML += `<li><span style="color: #f85149;">✘ 法術壓抑未滿 (${Math.round(spellSuppressed)}%)：</span> 面對高等異界圖的巨額法術傷害時仍具極高秒殺風險。</li>`;
        }
        if (life < 4500) {
          defHTML += `<li><span style="color: #f85149;">⚠️ 生命總血池偏低 (${Math.round(life)})：</span> 對於 ${level} 級的高階機體而言，4200 左右的血池處於危險邊緣，缺乏護甲或大量 ES 的防禦補強時，極易遭到連續物理擊中瞬殺。</li>`;
        } else {
          defHTML += `<li><span style="color: #3fb950;">✔ 生命總血池合格 (${Math.round(life)})。</span></li>`;
        }
        defHTML += `</ul></div>`;
        document.getElementById('deepDefenseAnalysis').innerHTML = defHTML;

        // --- 7. 生成深度分析：四、技能寶石審查 ---
        let gemHTML = `<div class="analysis-box warning"><ul>`;
        if (uniqueGems.length > 0) {
          uniqueGems.forEach(g => {
            let warnText = "";
            if ((g.includes("Shield") || g.includes("Frost") || g.includes("Spectre")) && intVal < 111) {
              warnText = ` <span style="color: #f85149;">(⚠️ 屬性警告：此寶石智力需求較高，當前 ${Math.round(intVal)} 智力恐導致失效)</span>`;
            }
            gemHTML += `<li><strong>${g}</strong>${warnText}</li>`;
          });
        } else {
          gemHTML += `<li>未偵測到有效寶石。</li>`;
        }
        gemHTML += `</ul></div>`;
        document.getElementById('gemAudit').innerHTML = gemHTML;

        // --- 8. 生成深度分析：五、AI 綜合優化指引 ---
        let planHTML = `<div class="analysis-box success"><ul>`;
        planHTML += `<li><strong>1. 優先補足智力缺口：</strong> 建議在飾品（戒指、項鍊）尋找「+全屬性」或「+智力」的次要詞綴，或暫時在天賦盤配置 1~2 個 +30 智力的基礎過路節點。</li>`;
        planHTML += `<li><strong>2. 提升有效血池 (EHP)：</strong> 嘗試將裝備上的生命詞綴洗高，目標將總血池拉抬至 4,800~5,000 以上。</li>`;
        planHTML += `<li><strong>3. 檢查關鍵光環保留：</strong> 確認智力補足後，光環是否能正常啟動且未擠壓到主技能的施放魔力。</li>`;
        planHTML += `</ul></div>`;
        document.getElementById('actionPlan').innerHTML = planHTML;

        resultBox.style.display = 'block';

      } catch (err) {
        console.error("解析失敗：", err);
        alert("解碼過程發生錯誤：" + err.message);
      }
    }
  </script>

</body>
</html>
