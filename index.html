<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 前端動態解析器</title>
  <!-- 載入 pako.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 30px; display: flex; flex-direction: column; align-items: center; }
    textarea { width: 100%; max-width: 900px; height: 120px; background: #161b22; color: #fff; border: 1px solid #30363d; padding: 10px; border-radius: 6px; font-family: monospace; }
    button { margin-top: 10px; padding: 10px 20px; background: #238636; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; align-self: flex-end; }
    button:hover { background: #2ea043; }
    .result { width: 100%; max-width: 900px; background: #161b22; border: 1px solid #30363d; padding: 20px; margin-top: 20px; border-radius: 6px; display: none; }
  </style>
</head>
<body>

  <h2>PoB 前端動態解析測試</h2>
  <textarea id="pobCodeInput" placeholder="請在此貼上 PoB 匯出碼..."></textarea>
  <button onclick="parseAndAnalyzePoB()">執行解析</button>

  <div class="result" id="resultBox">
    <h3 id="resTitle">解析結果</h3>
    <div id="resContent"></div>
  </div>

  <script>
    function parseAndAnalyzePoB() {
      const rawCode = document.getElementById('pobCodeInput').value.trim();
      const resultBox = document.getElementById('resultBox');

      // 防呆檢查 1：檢查 pako 是否載入
      if (typeof pako === 'undefined') {
        alert('錯誤：pako.js 壓縮庫未成功載入，請檢查網路！');
        return;
      }

      // 防呆檢查 2：檢查輸入框是否為空
      if (!rawCode) {
        alert('請先輸入 PoB 代碼！');
        return;
      }

      try {
        // Base64 轉換與 zlib 解壓
        let base64 = rawCode.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        const decompressed = pako.inflate(bytes, { to: 'string' });
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        // 讀取基本資料
        const buildNode = xmlDoc.querySelector("Build");
        const className = buildNode ? (buildNode.getAttribute("className") || "未知") : "未知";
        const level = buildNode ? (buildNode.getAttribute("level") || "0") : "0";

        document.getElementById('resTitle').innerText = `解析成功：${level} 級 ${className}`;
        document.getElementById('resContent').innerHTML = `<p>XML 結構已成功解開，職業為：<strong>${className}</strong>，等級：<strong>${level}</strong>。</p>`;
        resultBox.style.display = 'block';

      } catch (err) {
        console.error("解析發生錯誤：", err);
        alert('解析失敗！錯誤原因：' + err.message);
      }
    }
  </script>

</body>
</html>
