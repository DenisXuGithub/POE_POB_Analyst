<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 前端動態分析儀表板</title>
  <!-- 載入 pako.js 確保 zlib 解壓縮功能穩定 -->
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 1000px; }
    h2 { color: #f0a334; margin-bottom: 5px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e4e8;
      font-size: 13px;
      padding: 12px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
    }
    textarea:focus { border-color: #f0a334; outline: none; }
    button {
      margin-top: 10px;
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      float: right;
      transition: background 0.2s;
    }
    button:hover { background-color: #2ea043; }
    
    .analysis-result {
      width: 100%;
      max-width: 1000px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 25px;
      margin-top: 20px;
      box-sizing: border-box;
      line-height: 1.6;
      display: none;
    }
    .analysis-result h3 { color: #58a6ff; margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .analysis-result h4 { color: #f0a334; margin-top: 25px; margin-bottom: 10px; border-left: 4px solid #f0a334; padding-left: 10px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 15px 0;
    }
    .stat-card {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-card .label { font-size: 12px; color: #8b949e; }
    .stat-card .value { font-size: 18px; font-weight: bold; color: #f0a334; margin-top: 4px; }
    .stat-card .value.alert { color: #f85149; }
    .stat-card .value.safe { color: #3fb950; }
    
    .analysis-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .analysis-box.warning { border-left: 4px solid #f85149; }
    .analysis-box.info { border-left: 4px solid #58a6ff; }
    .analysis-box.success { border-left: 4px solid #3fb950; }
    
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; color: #f0a334; font-size: 13px; margin-right: 6px; }
    ul { padding-left: 20px; margin-top: 5px; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PoB 獨立引擎前端分析儀表板</h2>
    <p class="subtitle">貼上任何 PoB 匯出碼，透過獨立 JS 引擎解碼 XML 並執行前端屬性模擬加總</p>

    <textarea id="pobCodeInput" placeholder="在此貼上任意 PoB 匯出碼 (eJz...)"></textarea>
    <button type="button" onclick="parseAndAnalyzePoB()">執行獨立引擎剖析</button>

    <div class="analysis-result" id="resultBox">
      <h3 id="resTitle">動態分析報告</h3>
      <div id="resMeta" style="margin-bottom: 15px;"></div>
      
      <h4>一、 裝備與基礎屬性模擬加總 (Stats Grid)</h4>
      <div class="stats-grid" id="statsGrid"></div>

      <h4>二、 屬性門檻與寶石相容性動態審查</h4>
      <div id="attributeAudit"></div>

      <h4>三、 偵測到的核心技能寶石清單</h4>
      <div id="gemAudit"></div>

      <h4>四、 AI 綜合優化指引</h4>
      <div id="actionPlan"></div>
    </div>
  </div>

  <!-- 引入獨立的 JS 運算引擎 -->
  <script src="pob-parser.js"></script>
</body>
</html>
