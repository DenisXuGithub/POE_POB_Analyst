<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的自訂 PoB 分析儀表板</title>
  <!-- 載入 pako.js 處理 zlib 解壓縮 -->
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 1000px; }
    h2 { color: #38bdf8; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 13px;
      padding: 12px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
    }
    textarea:focus { border-color: #38bdf8; outline: none; }
    button {
      margin-top: 12px;
      padding: 12px 24px;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      float: right;
      transition: background 0.2s;
    }
    button:hover { background-color: #0369a1; }
    
    .dashboard {
      width: 100%;
      max-width: 1000px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 25px;
      margin-top: 30px;
      box-sizing: border-box;
      display: none;
    }
    .dashboard h3 { color: #38bdf8; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .dashboard h4 { color: #f59e0b; margin-top: 25px; margin-bottom: 10px; border-left: 4px solid #f59e0b; padding-left: 10px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card .label { font-size: 12px; color: #94a3b8; }
    .stat-card .value { font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 6px; }
    .stat-card .value.alert { color: #ef4444; }
    .stat-card .value.safe { color: #22c55e; }
    
    .ai-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .ai-box.warning { border-left: 4px solid #ef4444; }
    .ai-box.success { border-left: 4px solid #22c55e; }
    .ai-box.info { border-left: 4px solid #38bdf8; }
    
    .badge { background: #334155; padding: 4px 10px; border-radius: 6px; color: #f8fafc; font-size: 13px; margin-right: 8px; }
    ul { padding-left: 20px; margin-top: 5px; }
    li { margin-bottom: 8px; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PoB 自訂 UI 深度解析儀表板</h2>
    <p class="subtitle">貼上任意 PoB 匯出碼，前端將自動解密 XML、解析裝備與技能，並由內嵌 AI 邏輯產出健檢報告</p>

    <textarea id="pobInput" placeholder="請在此貼上 PoB 匯出碼 (eJz...)"></textarea>
    <button type="button" onclick="analyzePoB()">開始解析與 AI 健檢</button>

    <div class="dashboard" id="outputDashboard">
      <h3 id="charTitle">角色分析報告</h3>
      <div id="charMeta" style="margin-bottom: 15px;"></div>
      
      <h4>1. 核心裝備與基礎數值模擬</h4>
      <div class="stats-grid" id="statsGrid"></div>

      <h4>2. AI 智慧防禦與生存健檢</h4>
      <div id="defenseAudit"></div>

      <h4>3. 技能寶石串連與配置摘要</h4>
      <div id="gemAudit"></div>

      <h4>4. 流派優化建議與下一步</h4>
      <div id="actionPlan"></div>
    </div>
  </div>

  <script>
    const classMap = {
      "1": "女巫 (Witch)", "2": "暗影刺客 (Shadow)", "3": "遊俠 (Ranger)",
      "4": "決鬥者 (Duelist)", "5": "野蠻人 (Marauder)", "6": "聖堂武僧 (Templar)", "7": "貴族 (Scion)",
      "Witch": "女巫", "Shadow": "暗影", "Ranger": "遊俠", "Duelist": "決鬥者", "Marauder": "野蠻人", "Templar": "聖堂", "Scion": "貴族"
    };

    function analyzePoB() {
      const inputVal = document.getElementById('pobInput').value.trim();
      const dashboard = document.getElementById('outputDashboard');

      if (typeof pako === 'undefined') {
        alert("pako.js 尚未載入！");
        return;
      }
      if (!inputVal) {
        alert("請先貼上 PoB 代碼！");
        return;
      }

      try {
        // 1. Base64 轉換與 zlib 解壓縮
        let base64 = inputVal.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        const decompressed = pako.inflate(bytes, { to: 'string' });
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        if (xmlDoc.querySelector("parsererror")) {
          throw new Error("XML 結構解析失敗，請確認代碼是否完整。");
        }

        // 2. 提取基本資訊 (<Build>)
        const buildNode = xmlDoc.querySelector("Build");
        let level = buildNode ? (buildNode.getAttribute("level") || "1") : "1";
        let ascendClass = buildNode ? (buildNode.getAttribute("ascendClassName") || "未昇華") : "未昇華";
        let rawClass = buildNode ? (buildNode.getAttribute("className") || "") : "";
        let className = classMap[rawClass] || rawClass || "流亡者";

        // 3. 提取裝備與詞綴模擬加總 (<Item>)
        let totalLife = 0;
        let totalRes = 0;
        let itemCount = 0;

        xmlDoc.querySelectorAll("Item").forEach(item => {
          itemCount++;
          let text = item.textContent || "";
          let lifeMatch = text.match(/\+(\d+)\s+to maximum Life/i);
          let resMatch = text.match(/\+(\d+)%\s+to.*Resist/i);
          if (lifeMatch) totalLife += parseInt(lifeMatch[1]);
          if (resMatch) totalRes += parseInt(resMatch[1]);
        });

        // 4. 提取技能寶石 (<Gem>)
        let gems = [];
        xmlDoc.querySelectorAll("Gem").forEach(gem => {
          let name = gem.getAttribute("nameSpec") || gem.getAttribute("name");
          if (name && !gems.includes(name)) gems.push(name);
        });

        // 5. 渲染自訂 UI
        document.getElementById('charTitle').innerText = `解析結果：${level} 級 ${className} (${ascendClass})`;
        document.getElementById('charMeta').innerHTML = `
          <span class="badge">職業：${className}</span>
          <span class="badge">昇華：${ascendClass}</span>
          <span class="badge">等級：${level}</span>
          <span class="badge">裝備總數：${itemCount} 件</span>
        `;

        // 模擬數值計算
        let estLife = parseInt(level) * 12 + totalLife + 500;
        let lifeAlert = estLife < 3500 && parseInt(level) > 80;

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="label">估算總生命 (Est. Life)</div><div class="value ${lifeAlert ? 'alert' : 'safe'}">${estLife}</div></div>
          <div class="stat-card"><div class="label">裝備生命加總</div><div class="value">+${totalLife}</div></div>
          <div class="stat-card"><div class="label">抗性詞綴總量</div><div class="value">~${totalRes}%</div></div>
          <div class="stat-card"><div class="label">已偵測寶石種類</div><div class="value">${gems.length} 種</div></div>
        `;

        // AI 智慧防禦分析
        let defHTML = `<div class="ai-box ${lifeAlert ? 'warning' : 'success'}">`;
        if (lifeAlert) {
          defHTML += `<p><strong>⚠️ 生存血池偏低警告：</strong>當前等級為 ${level} 級，但估算生命僅有 ${estLife}。在高階異界地圖中容易遭受秒殺，建議優先在防具上補足最大生命詞綴。</p>`;
        } else {
          defHTML += `<p><strong>✔ 生存基礎健康：</strong>當前血池估算達 ${estLife}，符合基礎生存標準。</p>`;
        }
        defHTML += `</div>`;
        document.getElementById('defenseAudit').innerHTML = defHTML;

        // 寶石列表
        let gemHTML = `<div class="ai-box info"><ul>`;
        if (gems.length > 0) {
          gems.slice(0, 12).forEach(g => { gemHTML += `<li>${g}</li>`; });
        } else {
          gemHTML += `<li>未在 XML 中讀取到有效寶石。</li>`;
        }
        gemHTML += `</ul></div>`;
        document.getElementById('gemAudit').innerHTML = gemHTML;

        // AI 優化建議
        let planHTML = `<div class="ai-box success"><ul>`;
        planHTML += `<li>確認三大元素抗性是否皆已達到 75% 滿抗。</li>`;
        planHTML += `<li>檢查核心輸出技能是否已完成 6 連（6-Link）配置。</li>`;
        planHTML += `<li>此介面完全由您自己的前端 UI 進行渲染，可自由修改 CSS 樣式與排版。</li>`;
        planHTML += `</ul></div>`;
        document.getElementById('actionPlan').innerHTML = planHTML;

        dashboard.style.display = 'block';

      } catch (err) {
        console.error(err);
        alert("解析失敗，請確認代碼是否正確：" + err.message);
      }
    }
  </script>
</body>
</html>
