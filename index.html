<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 全數據深度分析儀表板</title>
  <!-- 載入 unpkg 的 pako.js 確保穩定 -->
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 950px; }
    h2 { color: #f0a334; }
    textarea {
      width: 100%;
      height: 120px;
      background: #161b22;
      color: #e1e4e8;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 12px 24px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      float: right;
    }
    button:hover { background: #2ea043; }
    .result {
      width: 100%;
      max-width: 950px;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 25px;
      margin-top: 20px;
      border-radius: 8px;
      display: none;
      box-sizing: border-box;
      line-height: 1.6;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 15px 0;
    }
    .stat-card {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-card .label { font-size: 12px; color: #8b949e; }
    .stat-card .value { font-size: 18px; font-weight: bold; color: #f0a334; margin-top: 4px; }
    .stat-card .value.alert { color: #f85149; }
    .stat-card .value.safe { color: #3fb950; }
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; color: #f0a334; font-size: 13px; margin-right: 6px; }
    ul { padding-left: 20px; margin-top: 5px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PoB 全數據深度分析儀表板</h2>
    <textarea id="pobCodeInput" placeholder="請在此貼上 PoB 匯出碼 (eJz...)"></textarea>
    <button type="button" onclick="parseAndAnalyzePoB()">執行全數據解析</button>
  </div>

  <div class="result" id="resultBox">
    <h3 id="resTitle" style="color: #58a6ff; margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px;">解析結果</h3>
    <div id="resMeta" style="margin-bottom: 15px;"></div>
    
    <h4>一、 面板核心數字監控 (Stats Grid)</h4>
    <div class="stats-grid" id="statsGrid"></div>

    <h4>二、 數字量化健康度診斷</h4>
    <div id="numericDiagnosis"></div>

    <h4>三、 偵測到的核心寶石清單</h4>
    <div id="gemDetails"></div>
  </div>

  <script>
    // 常見 PoB 職業 ID 對照表
    const classMap = {
      "1": "女巫 (Witch)",
      "2": "暗影刺客 (Shadow)",
      "3": "遊俠 (Ranger)",
      "4": "決鬥者 (Duelist)",
      "5": "野蠻人 (Marauder)",
      "6": "聖堂武僧 (Templar)",
      "7": "貴族 (Scion)"
    };

    function parseAndAnalyzePoB() {
      const rawInput = document.getElementById('pobCodeInput');
      const resultBox = document.getElementById('resultBox');

      if (typeof pako === 'undefined') {
        alert("系統錯誤：pako.js 程式庫未載入成功！");
        return;
      }

      const rawCode = rawInput.value.trim();
