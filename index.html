<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 線上分析檢視器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1115;
      color: #e1e4e8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0a334; margin-bottom: 10px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; text-align: center; }
    .search-box {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 15px;
    }
    input[type="text"]:focus {
      border-color: #f0a334;
      outline: none;
    }
    button {
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    button:hover { background-color: #2ea043; }
    .display-frame {
      width: 100%;
      max-width: 1200px;
      height: 80vh;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .placeholder {
      color: #8b949e;
      text-align: center;
      font-size: 16px;
      padding: 20px;
      line-height: 1.6;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h2>Path of Building 線上解析檢視器</h2>
  <p class="subtitle">請將 pobb.in 的網址（或包含 embed 的完整網址）貼入下方，即可完美載入！</p>

  <div class="search-box">
    <input type="text" id="pobInput" placeholder="例如: https://pobb.in/xxxxx">
    <button onclick="renderPoB()">載入分析</button>
  </div>

  <div class="display-frame" id="viewerContainer">
    <div class="placeholder">尚無資料，請於上方輸入網址並點擊載入。</div>
  </div>

  <script>
    function renderPoB() {
      const inputElem = document.getElementById('pobInput');
      const container = document.getElementById('viewerContainer');
      
      if (!inputElem) {
        alert('找不到輸入框元件！');
        return;
      }

      let inputVal = inputElem.value.trim();

      if (!inputVal) {
        alert('請先輸入 pobb.in 的網址！');
        return;
      }

      // 如果使用者貼上的是純代碼而不是網址，給予提示
      if (!inputVal.startsWith('http')) {
        container.innerHTML = `<div class="placeholder" style="color: #f0a334;">
          請先至 <a href="https://pobb.in/" target="_blank">pobb.in</a> 將您的代碼轉成網址，<br>再將該網址貼到上方輸入框中！
        </div>`;
        return;
      }

      // 自動轉換為 pobb.in 專用的 embed 嵌入格式
      let targetUrl = inputVal;
      if (targetUrl.includes('pobb.in')) {
        targetUrl = targetUrl.replace(/\/$/, ''); // 移除結尾斜線
        if (!targetUrl.endsWith('/embed')) {
          targetUrl += '/embed';
        }
      }

      // 嚴格寫入 iframe 進行渲染
      container.innerHTML = `<iframe src="${targetUrl}" width="100%" height="100%" style="border:none;"></iframe>`;
    }
  </script>

</body>
</html>
