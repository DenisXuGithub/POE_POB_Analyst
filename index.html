<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB Web Viewer - 流亡黯道 PoB 線上解析器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #f39c12; }
    .input-container {
      margin-bottom: 20px;
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background: #e67e22;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #d35400; }
    .viewer-container {
      width: 100%;
      max-width: 1200px;
      height: 800px;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #0d0d0d;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <h1>PoB 線上分析與展示器</h1>
  
  <div class="input-container">
    <input type="text" id="pobInput" placeholder="請貼上 PoB 匯出碼或 pobb.in 連結...">
    <button onclick="loadPoB()">載入分析</button>
  </div>

  <div class="viewer-container" id="viewerBox">
    <p style="text-align: center; color: #888; margin-top: 50px;">請在上方輸入 PoB Code 並點擊「載入分析」</p>
  </div>

  <script>
    async function loadPoB() {
      const input = document.getElementById('pobInput').value.trim();
      const viewerBox = document.getElementById('viewerBox');

      if (!input) {
        alert("請輸入 PoB Code！");
        return;
      }

      viewerBox.innerHTML = `<p style="text-align: center; color: #f39c12; margin-top: 50px;">載入解析中，請稍候...</p>`;

      try {
        // 如果輸入的是純 Code，呼叫 pobb.in API 進行轉譯
        if (!input.startsWith('http')) {
          const response = await fetch('https://pobb.in/pob/' + encodeURIComponent(input), {
            method: 'POST'
          });
          const data = await response.json();
          if (data.url) {
            viewerBox.innerHTML = `<iframe src="${data.url}"></iframe>`;
          } else {
            alert('PoB Code 解析失敗，請檢查格式是否正確。');
          }
        } else {
          // 如果直接貼上 pobb.in 網址
          viewerBox.innerHTML = `<iframe src="${input}"></iframe>`;
        }
      } catch (err) {
        console.error(err);
        alert('發生錯誤：無法處理該 PoB Code。');
      }
    }
  </script>

</body>
</html>
