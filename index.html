<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 萬用動態智慧分析儀表板</title>
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 1000px; }
    h2 { color: #f0a334; margin-bottom: 5px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e4e8;
      font-size: 13px;
      padding: 12px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
    }
    textarea:focus { border-color: #f0a334; outline: none; }
    button {
      margin-top: 10px;
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      float: right;
      transition: background 0.2s;
    }
    button:hover { background-color: #2ea043; }
    
    .analysis-result {
      width: 100%;
      max-width: 1000px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 25px;
      margin-top: 20px;
      box-sizing: border-box;
      line-height: 1.6;
      display: none;
    }
    .analysis-result h3 { color: #58a6ff; margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .analysis-result h4 { color: #f0a334; margin-top: 25px; margin-bottom: 10px; border-left: 4px solid #f0a334; padding-left: 10px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 15px 0;
    }
    .stat-card {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-card .label { font-size: 12px; color: #8b949e; }
    .stat-card .value { font-size: 18px; font-weight: bold; color: #f0a334; margin-top: 4px; }
    .stat-card .value.alert { color: #f85149; }
    .stat-card .value.safe { color: #3fb950; }
    
    .analysis-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .analysis-box.warning { border-left: 4px solid #f85149; }
    .analysis-box.info { border-left: 4px solid #58a6ff; }
    .analysis-box.success { border-left: 4px solid #3fb950; }
    
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; color: #f0a334; font-size: 13px; margin-right: 6px; }
    ul { padding-left: 20px; margin-top: 5px; }
    li { margin-bottom: 8px; }
    .debug-log { background: #000; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px; max-height: 150px; overflow-y: auto; margin-top: 15px; border-radius: 4px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PoB 萬用動態智慧分析儀表板</h2>
    <p class="subtitle">貼上**任何版本**的 PoB 代碼，前端引擎將自動解碼並動態抓取所有真實數值</p>

    <textarea id="pobCodeInput" placeholder="在此貼上任意 PoB 匯出碼 (eJz...)"></textarea>
    <button type="button" onclick="parseAndAnalyzePoB()">執行動態智慧剖析</button>

    <div class="analysis-result" id="resultBox">
      <h3 id="resTitle">動態分析報告</h3>
      <div id="resMeta" style="margin-bottom: 15px;"></div>
      
      <h4>一、 核心面板數字監控 (Stats Grid)</h4>
      <div class="stats-grid" id="statsGrid"></div>

      <h4>二、 屬性門檻與瓶頸動態審查</h4>
      <div id="attributeAudit"></div>

      <h4>三、 生存防禦架構動態量化評估</h4>
      <div id="defenseAudit"></div>

      <h4>四、 技能寶石清單</h4>
      <div id="gemAudit"></div>

      <h4>五、 動態優化指引</h4>
      <div id="actionPlan"></div>

      <h4>六、 原始資料偵錯日誌 (Debug Log)</h4>
      <div class="debug-log" id="debugLog"></div>
    </div>
  </div>

  <script>
    const classMapping = {
      "1": "女巫 (Witch)", "2": "暗影刺客 (Shadow)", "3": "遊俠 (Ranger)",
      "4": "決鬥者 (Duelist)", "5": "野蠻人 (Marauder)", "6": "聖堂武僧 (Templar)", "7": "貴族 (Scion)",
      "Witch": "女巫 (Witch)", "Shadow": "暗影刺客 (Shadow)", "Ranger": "遊俠 (Ranger)",
      "Duelist": "決鬥者 (Duelist)", "Marauder": "野蠻人 (Marauder)", "Templar": "聖堂武僧 (Templar)", "Scion": "貴族 (Scion)"
    };

    function parseAndAnalyzePoB() {
      const rawInput = document.getElementById('pobCodeInput');
      const resultBox = document.getElementById('resultBox');
      const debugLog = document.getElementById('debugLog');
      let logText = "";

      if (typeof pako === 'undefined') {
        alert("系統錯誤：pako.js 未成功載入！");
        return;
      }

      const rawCode = rawInput.value.trim();
      if (!rawCode) {
        alert("請先貼上 PoB 匯出碼！");
        return;
      }

      try {
        let base64 = rawCode.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        const decompressed = pako.inflate(bytes, { to: 'string' });
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        if (xmlDoc.querySelector("parsererror")) {
          throw new Error("XML 解析失敗，字串格式不正確。");
        }

        // --- 1. 深度抓取基本資料 ---
        const buildNode = xmlDoc.querySelector("Build");
        let level = 1;
        let ascendName = "未昇華";
        let className = "未知職業";

        if (buildNode) {
          level = parseInt(buildNode.getAttribute("level")) || 1;
          ascendName = buildNode.getAttribute("ascendClassName") || buildNode.getAttribute("ascendClass") || "未昇華";
          
          let rawClass = buildNode.getAttribute("className") || buildNode.getAttribute("class") || buildNode.getAttribute("classId");
          className = classMapping[rawClass] || rawClass || "未知職業";
        }

        // --- 2. 全面萬用掃描 PlayerStat 與 Stat 節點 ---
        let statsMap = {};
        
        // 抓取所有可能帶有數值的標籤
        xmlDoc.querySelectorAll("PlayerStat, Stat, Spec").forEach(node => {
          // 檢查所有屬性
          const attrNames = node.getAttributeNames ? node.getAttributeNames() : [];
          let statName = "";
          let statVal = 0;

          attrNames.forEach(attr => {
            const val = node.getAttribute(attr);
            if (attr === 'stat' || attr === 'name' || attr === 'id') {
              statName = val;
            }
            if (attr === 'value' || attr === 'data') {
              statVal = parseFloat(val) || 0;
            }
          });

          if (statName) {
            statsMap[statName.toLowerCase()] = statVal;
            logText += `[抓取] ${statName} = ${statVal}\n`;
          }

          // 同時把節點本身的屬性也過一遍
          attrNames.forEach(attr => {
            statsMap[attr.toLowerCase()] = parseFloat(node.getAttribute(attr)) || 0;
          });
        });

        // 智慧對應變數
        let life = statsMap["life"] || statsMap["maxlife"] || 0;
        let es = statsMap["energyshield"] || statsMap["es"] || 0;
        let str = statsMap["str"] || statsMap["strength"] || statsMap["targetstrength"] || 0;
        let dex = statsMap["dex"] || statsMap["dexterity"] || statsMap["targetdexterity"] || 0;
        let intVal = statsMap["int"] || statsMap["intelligence"] || statsMap["targetintelligence"] || 0;
        let spellSuppressed = statsMap["spellsuppresschance"] || statsMap["spellsuppressionchance"] || 0;

        // 如果數值還是 0，嘗試直接從 Build 屬性撈取
        if (str === 0 && buildNode) {
          str = parseInt(buildNode.getAttribute("targetStrength") || buildNode.getAttribute("strength")) || 0;
          dex = parseInt(buildNode.getAttribute("targetDexterity") || buildNode.getAttribute("dexterity")) || 0;
          intVal = parseInt(buildNode.getAttribute("targetIntelligence") || buildNode.getAttribute("intelligence")) || 0;
        }

        logText += `\n解析結果 -> 生命:${life}, 護盾:${es}, 力量:${str}, 敏捷:${dex}, 智力:${intVal}, 法壓:${spellSuppressed}\n`;
        debugLog.innerText = logText;
        debugLog.style.display = 'block';

        // --- 3. 動態讀取寶石 ---
        const gems = Array.from(xmlDoc.querySelectorAll("Gem")).map(gem => ({
          name: gem.getAttribute("nameSpec") || gem.getAttribute("name") || gem.getAttribute("gemId"),
          level: gem.getAttribute("level")
        })).filter(g => g.name);

        const uniqueGems = [...new Set(gems.map(g => g.name))];

        // --- 4. 渲染 UI 畫面 ---
        document.getElementById('resTitle').innerText = `動態解析報告：${level} 級 ${className} (${ascendName})`;
        document.getElementById('resMeta').innerHTML = `
          <span class="badge">職業：${className}</span>
          <span class="badge">昇華：${ascendName}</span>
          <span class="badge">等級：${level} 級</span>
          <span class="badge">偵測寶石總數：${gems.length} 顆</span>
        `;

        let intAlert = (intVal > 0 && intVal < 111);
        let suppressAlert = (spellSuppressed > 0 && spellSuppressed < 100);

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="label">最大生命 (Life)</div><div class="value">${Math.round(life)}</div></div>
          <div class="stat-card"><div class="label">能量護盾 (ES)</div><div class="value">${Math.round(es)}</div></div>
          <div class="stat-card"><div class="label">力量 (Str)</div><div class="value">${Math.round(str)}</div></div>
          <div class="stat-card"><div class="label">敏捷 (Dex)</div><div class="value">${Math.round(dex)}</div></div>
          <div class="stat-card"><div class="label">智力 (Int)</div><div class="value ${intAlert ? 'alert' : 'safe'}">${Math.round(intVal)}</div></div>
          <div class="stat-card"><div class="label">法術壓抑 (Suppress)</div><div class="value ${suppressAlert ? 'alert' : 'safe'}">${Math.round(spellSuppressed)}%</div></div>
        `;

        // --- 5. 動態分析內文 ---
        let attrHTML = `<div class="analysis-box ${intAlert ? 'warning' : 'success'}">`;
        if (intVal > 0 && intVal < 111) {
          attrHTML += `<p><strong style="color: #f85149;">【屬性警示】當前智力為 ${Math.round(intVal)} (低於 111 門檻)</strong></p>`;
        } else {
          attrHTML += `<p><span style="color: #3fb950;">【屬性判定】當前智力為 ${Math.round(intVal)}，符合目前基礎門檻。</span></p>`;
        }
        attrHTML += `</div>`;
        document.getElementById('attributeAudit').innerHTML = attrHTML;

        let defHTML = `<div class="analysis-box info">`;
        defHTML += `<p><strong>防禦指標動態評估</strong></p><ul>`;
        defHTML += `<li>法術壓抑動態偵測：<strong>${Math.round(spellSuppressed)}%</strong></li>`;
        defHTML += `<li>生命總池動態偵測：<strong>${Math.round(life)}</strong></li>`;
        defHTML += `</ul></div>`;
        document.getElementById('defenseAudit').innerHTML = defHTML;

        let gemHTML = `<div class="analysis-box warning"><ul>`;
        if (uniqueGems.length > 0) {
          uniqueGems.forEach(g => {
            gemHTML += `<li><strong>${g}</strong></li>`;
          });
        } else {
          gemHTML += `<li>未讀取到有效的寶石清單。</li>`;
        }
        gemHTML += `</ul></div>`;
        document.getElementById('gemAudit').innerHTML = gemHTML;

        let planHTML = `<div class="analysis-box success"><ul>`;
        planHTML += `<li>此報告完全基於您貼上的 PoB 原始碼進行動態 XML 掃描。</li>`;
        planHTML += `<li>若下方「原始資料偵錯日誌」中有抓到對應數值但面板未顯示，可隨時將該日誌提供給我以精準對應！</li>`;
        planHTML += `</ul></div>`;
        document.getElementById('actionPlan').innerHTML = planHTML;

        resultBox.style.display = 'block';

      } catch (err) {
        console.error("解析錯誤：", err);
        alert("PoB 解析失敗，請確認代碼是否完整：" + err.message);
      }
    }
  </script>

</body>
</html>
