<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 萬用動態智慧分析儀表板</title>
  <!-- 載入 unpkg pako.js 解壓縮庫 -->
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 1000px; }
    h2 { color: #f0a334; margin-bottom: 5px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e4e8;
      font-size: 13px;
      padding: 12px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
    }
    textarea:focus { border-color: #f0a334; outline: none; }
    button {
      margin-top: 10px;
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      float: right;
      transition: background 0.2s;
    }
    button:hover { background-color: #2ea043; }
    
    .analysis-result {
      width: 100%;
      max-width: 1000px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 25px;
      margin-top: 20px;
      box-sizing: border-box;
      line-height: 1.6;
      display: none;
    }
    .analysis-result h3 { color: #58a6ff; margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .analysis-result h4 { color: #f0a334; margin-top: 25px; margin-bottom: 10px; border-left: 4px solid #f0a334; padding-left: 10px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 15px 0;
    }
    .stat-card {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-card .label { font-size: 12px; color: #8b949e; }
    .stat-card .value { font-size: 18px; font-weight: bold; color: #f0a334; margin-top: 4px; }
    .stat-card .value.alert { color: #f85149; }
    .stat-card .value.safe { color: #3fb950; }
    
    .analysis-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .analysis-box.warning { border-left: 4px solid #f85149; }
    .analysis-box.info { border-left: 4px solid #58a6ff; }
    .analysis-box.success { border-left: 4px solid #3fb950; }
    
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; color: #f0a334; font-size: 13px; margin-right: 6px; }
    ul { padding-left: 20px; margin-top: 5px; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PoB 萬用動態智慧分析儀表板</h2>
    <p class="subtitle">貼上**任何**職業、**任何**等級的 PoB 代碼，前端引擎將即時解碼 XML 並針對該組數據進行動態量化剖析</p>

    <textarea id="pobCodeInput" placeholder="在此貼上任意 PoB 匯出碼 (eJz...)"></textarea>
    <button type="button" onclick="parseAndAnalyzePoB()">執行動態智慧剖析</button>

    <div class="analysis-result" id="resultBox">
      <h3 id="resTitle">動態分析報告</h3>
      <div id="resMeta" style="margin-bottom: 15px;"></div>
      
      <h4>一、 動態擷取核心面板數字 (Stats Grid)</h4>
      <div class="stats-grid" id="statsGrid"></div>

      <h4>二、 根據真實數據動態生成的屬性與門檻審查</h4>
      <div id="attributeAudit"></div>

      <h4>三、 生存防禦架構動態量化評估</h4>
      <div id="defenseAudit"></div>

      <h4>四、 偵測到的技能寶石與動態相容性檢查</h4>
      <div id="gemAudit"></div>

      <h4>五、 針對此 PoB 現況產出的動態優化指引</h4>
      <div id="actionPlan"></div>
    </div>
  </div>

  <script>
    const classMapping = {
      "1": "女巫 (Witch)", "2": "暗影刺客 (Shadow)", "3": "遊俠 (Ranger)",
      "4": "決鬥者 (Duelist)", "5": "野蠻人 (Marauder)", "6": "聖堂武僧 (Templar)", "7": "貴族 (Scion)",
      "Witch": "女巫 (Witch)", "Shadow": "暗影刺客 (Shadow)", "Ranger": "遊俠 (Ranger)",
      "Duelist": "決鬥者 (Duelist)", "Marauder": "野蠻人 (Marauder)", "Templar": "聖堂武僧 (Templar)", "Scion": "貴族 (Scion)"
    };

    function parseAndAnalyzePoB() {
      const rawInput = document.getElementById('pobCodeInput');
      const resultBox = document.getElementById('resultBox');

      if (typeof pako === 'undefined') {
        alert("系統錯誤：pako.js 未成功載入！");
        return;
      }

      const rawCode = rawInput.value.trim();
      if (!rawCode) {
        alert("請先貼上 PoB 匯出碼！");
        return;
      }

      try {
        let base64 = rawCode.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        const decompressed = pako.inflate(bytes, { to: 'string' });
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        if (xmlDoc.querySelector("parsererror")) {
          throw new Error("XML 解析失敗，字串格式不正確。");
        }

        // --- 1. 動態讀取基本資料 ---
        const buildNode = xmlDoc.querySelector("Build");
        const playerNode = xmlDoc.querySelector("Player");

        let level = 1;
        let ascendName = "未昇華";
        let rawClassKey = "";

        if (buildNode) {
          level = parseInt(buildNode.getAttribute("level")) || 1;
          ascendName = buildNode.getAttribute("ascendClassName") || buildNode.getAttribute("ascendClass") || "未昇華";
          rawClassKey = buildNode.getAttribute("className") || buildNode.getAttribute("class") || buildNode.getAttribute("classId");
        }
        if (!rawClassKey && playerNode) {
          rawClassKey = playerNode.getAttribute("className") || playerNode.getAttribute("class") || playerNode.getAttribute("classId");
        }

        let className = classMapping[rawClassKey] || rawClassKey || "未知職業";

        // --- 2. 徹底動態抓取 PlayerStat / Stat 數值字典 ---
        let statsMap = {};
        xmlDoc.querySelectorAll("PlayerStat, Stat").forEach(stat => {
          const name = stat.getAttribute("stat") || stat.getAttribute("name");
          const val = parseFloat(stat.getAttribute("value")) || 0;
          if (name) statsMap[name] = val;
        });

        // 完全動態抓取，若無對應標籤則預設為 0，絕不寫死假資料
        let life = statsMap["Life"] || statsMap["life"] || 0;
        let es = statsMap["EnergyShield"] || statsMap["energyShield"] || statsMap["Energy Shield"] || 0;
        let str = statsMap["Str"] || statsMap["str"] || statsMap["Strength"] || 0;
        let dex = statsMap["Dex"] || statsMap["dex"] || statsMap["Dexterity"] || 0;
        let intVal = statsMap["Int"] || statsMap["int"] || statsMap["Intelligence"] || 0;
        let spellSuppressed = statsMap["SpellSuppressChance"] || statsMap["spellSuppressChance"] || 0;

        // 備援抓取
        if (str === 0 && buildNode) {
          str = parseInt(buildNode.getAttribute("targetStrength")) || 0;
          dex = parseInt(buildNode.getAttribute("targetDexterity")) || 0;
          intVal = parseInt(buildNode.getAttribute("targetIntelligence")) || 0;
        }

        // --- 3. 動態讀取寶石 ---
        const gems = Array.from(xmlDoc.querySelectorAll("Gem")).map(gem => ({
          name: gem.getAttribute("nameSpec") || gem.getAttribute("name"),
          level: gem.getAttribute("level")
        })).filter(g => g.name);

        const uniqueGems = [...new Set(gems.map(g => g.name))];

        // --- 4. 渲染 UI 標頭與數據方格 (完全依據動態讀取的數值呈現) ---
        document.getElementById('resTitle').innerText = `動態解析報告：${level} 級 ${className} (${ascendName})`;
        document.getElementById('resMeta').innerHTML = `
          <span class="badge">職業：${className}</span>
          <span class="badge">昇華：${ascendName}</span>
          <span class="badge">等級：${level} 級</span>
          <span class="badge">偵測寶石總數：${gems.length} 顆</span>
        `;

        // 動態門檻判定：高於 85 等時，生命低於 4200 才亮紅燈；若小於 85 等則採動態寬容標準
        let lifeAlert = (level >= 85 && life > 0 && life < 4200);
        let intAlert = (intVal > 0 && intVal < 111);
        let suppressAlert = (spellSuppressed > 0 && spellSuppressed < 100);

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="label">最大生命 (Life)</div><div class="value ${lifeAlert ? 'alert' : 'safe'}">${Math.round(life)}</div></div>
          <div class="stat-card"><div class="label">能量護盾 (ES)</div><div class="value">${Math.round(es)}</div></div>
          <div class="stat-card"><div class="label">力量 (Str)</div><div class="value">${Math.round(str)}</div></div>
          <div class="stat-card"><div class="label">敏捷 (Dex)</div><div class="value">${Math.round(dex)}</div></div>
          <div class="stat-card"><div class="label">智力 (Int)</div><div class="value ${intAlert ? 'alert' : 'safe'}">${Math.round(intVal)}</div></div>
          <div class="stat-card"><div class="label">法術壓抑 (Suppress)</div><div class="value ${suppressAlert ? 'alert' : 'safe'}">${Math.round(spellSuppressed)}%</div></div>
        `;

        // --- 5. 動態生成分析內文 (根據當前輸入的 PoB 數據即時運算) ---
        
        // (1) 屬性動態審查
        let attrHTML = `<div class="analysis-box ${intAlert ? 'warning' : 'success'}">`;
        if (intVal > 0 && intVal < 111) {
          attrHTML += `<p><strong style="color: #f85149;">【動態屬性警示】當前智力偵測值為 ${Math.round(intVal)} (低於 111 門檻)</strong></p>`;
          attrHTML += `<p>系統偵測到此 PoB 的智力未達部分高等藍色輔助寶石的需求，配置時需注意是否會發生屬性不足而卡死的情況。</p>`;
        } else {
          attrHTML += `<p><span style="color: #3fb950;">【屬性動態判定】當前智力為 ${Math.round(intVal)}，符合目前基礎門檻。</span></p>`;
        }
        attrHTML += `</div>`;
        document.getElementById('attributeAudit').innerHTML = attrHTML;

        // (2) 生存防禦動態審查
        let defHTML = `<div class="analysis-box info">`;
        defHTML += `<p><strong>防禦指標動態評估</strong></p><ul>`;
        if (spellSuppressed >= 100) {
          defHTML += `<li><span style="color: #3fb950;">✔ 法術壓抑已達 100% 滿壓：</span> 具備優秀的法術減免效益。</li>`;
        } else if (spellSuppressed > 0) {
          defHTML += `<li><span style="color: #f85149;">⚠️ 法術壓抑未滿 (${Math.round(spellSuppressed)}%)：</span> 尚未達到滿壓狀態。</li>`;
        } else {
          defHTML += `<li><span>ℹ️ 無法術壓抑數據或未配置。</span></li>`;
        }

        if (level >= 85) {
          if (life > 0 && life < 4200) {
            defHTML += `<li><span style="color: #f85149;">⚠️ 生命總池 (${Math.round(life)}) 在 ${level} 級環境偏低。</span></li>`;
          } else if (life >= 4200) {
            defHTML += `<li><span style="color: #3fb950;">✔ 生命總池 (${Math.round(life)}) 達到基準。</span></li>`;
          }
        }
        defHTML += `</ul></div>`;
        document.getElementById('defenseAudit').innerHTML = defHTML;

        // (3) 寶石動態比對
        let gemHTML = `<div class="analysis-box warning"><ul>`;
        if (uniqueGems.length > 0) {
          uniqueGems.forEach(g => {
            let note = "";
            if (intAlert && (g.includes("Shield") || g.includes("Support") || g.includes("Spell"))) {
              note = ` <span style="color: #f85149;">(⚠️ 智力偏低，請留意配戴門檻)</span>`;
            }
            gemHTML += `<li><strong>${g}</strong>${note}</li>`;
          });
        } else {
          gemHTML += `<li>未讀取到有效的寶石清單。</li>`;
        }
        gemHTML += `</ul></div>`;
        document.getElementById('gemAudit').innerHTML = gemHTML;

        // (4) 動態優化指引
        let planHTML = `<div class="analysis-box success"><ul>`;
        if (intAlert) {
          planHTML += `<li>建議透過裝備或天賦補足智力，以解鎖所有技能需求。</li>`;
        }
        if (level >= 85 && life < 4200 && life > 0) {
          planHTML += `<li>建議提高防具的生命詞綴，增強高階地圖的生存能力。</li>`;
        }
        planHTML += `<li>此報告完全基於您當前輸入的 PoB 原始數據進行動態運算。</li>`;
        planHTML += `</ul></div>`;
        document.getElementById('actionPlan').innerHTML = planHTML;

        resultBox.style.display = 'block';

      } catch (err) {
        console.error("解析錯誤：", err);
        alert("PoB 解析失敗，請確認代碼是否完整：" + err.message);
      }
    }
  </script>

</body>
</html>
