<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 全數據深度分析儀表板</title>
  <!-- 載入 pako.js 進行前端 zlib 解壓縮 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0a334; margin-bottom: 5px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; text-align: center; }
    .input-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px 16px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e4e8;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      font-family: monospace;
    }
    textarea:focus { border-color: #f0a334; outline: none; }
    button {
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      align-self: flex-end;
      transition: background 0.2s;
    }
    button:hover { background-color: #2ea043; }
    .analysis-result {
      width: 100%;
      max-width: 1000px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 25px;
      box-sizing: border-box;
      line-height: 1.6;
      display: none;
    }
    .analysis-result h3 { color: #58a6ff; margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .analysis-result h4 { color: #f0a334; margin-top: 22px; margin-bottom: 8px; border-left: 3px solid #f0a334; padding-left: 8px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 15px 0;
    }
    .stat-card {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-card .label { font-size: 12px; color: #8b949e; }
    .stat-card .value { font-size: 18px; font-weight: bold; color: #f0a334; margin-top: 4px; }
    .stat-card .value.alert { color: #f85149; }
    .stat-card .value.safe { color: #3fb950; }
    ul { padding-left: 20px; margin-top: 5px; }
    li { margin-bottom: 6px; }
    .badge-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; font-size: 13px; color: #f0a334; }
    .debug-box { background: #1f2428; border: 1px solid #444c56; padding: 10px; margin-top: 15px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>

  <h2>PoB 全數值動態剖析儀表板</h2>
  <p class="subtitle">貼上任意 PoB 代碼，前端自動解碼 XML 並對所有關鍵數字進行量化審查</p>

  <div class="input-container">
    <textarea id="pobCodeInput" placeholder="在此貼上任何 PoB 匯出碼 (eJz...)"></textarea>
    <button onclick="parseAndAnalyzePoB()">執行全數據深度剖析</button>
  </div>

  <div class="analysis-result" id="resultBox">
    <h3 id="buildTitle">角色分析報告</h3>
    <div class="badge-group" id="buildMeta"></div>
    
    <h4>一、 面板核心數字監控 (Stats Grid)</h4>
    <div class="stats-grid" id="statsGrid"></div>

    <h4>二、 數字量化健康度診斷</h4>
    <div id="numericDiagnosis"></div>

    <h4>三、 技能寶石串連與等級明細</h4>
    <div id="gemDetails"></div>

    <h4>四、 XML 結構除錯檢視 (Debug)</h4>
    <div class="debug-box" id="debugOutput">尚未載入數據</div>
  </div>

  <script>
    function parseAndAnalyzePoB() {
      const rawCode = document.getElementById('pobCodeInput').value.trim();
      const resultBox = document.getElementById('resultBox');

      if (typeof pako === 'undefined') {
        alert('錯誤：pako.js 壓縮庫未成功載入！');
        return;
      }

      if (!rawCode) {
        alert('請先輸入 PoB 代碼！');
        return;
      }

      try {
        // 1. Base64 格式修正與解碼
        let base64 = rawCode.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        // 2. pako.js zlib 解壓縮
        const decompressed = pako.inflate(bytes, { to: 'string' });

        // 3. XML DOM 解析
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        // --- 讀取基礎屬性 ---
        const buildNode = xmlDoc.querySelector("Build");
        const className = buildNode ? (buildNode.getAttribute("className") || "未知職業") : "未知職業";
        const ascendName = buildNode ? (buildNode.getAttribute("ascendClassName") || "未昇華") : "未昇華";
        const level = parseInt(buildNode ? buildNode.getAttribute("level") : "0") || 0;

        // --- 遍歷所有 Stat 或 PlayerStat 節點來抓取數據 ---
        let statsMap = {};
        
        // 嘗試抓取各種可能的數值標籤 (Stat, PlayerStat, Spec Stat 等)
        const statNodes = xmlDoc.querySelectorAll("PlayerStat, Stat");
        statNodes.forEach(node => {
          const name = node.getAttribute("stat") || node.getAttribute("name");
          const val = node.getAttribute("value") || node.textContent;
          if (name) {
            statsMap[name] = parseFloat(val) || 0;
          }
        });

        // 提取常用數值（具備多種命名相容性）
        let life = statsMap["Life"] || statsMap["life"] || 0;
        let es = statsMap["EnergyShield"] || statsMap["energyShield"] || 0;
        let str = statsMap["Str"] || statsMap["str"] || 0;
        let dex = statsMap["Dex"] || statsMap
