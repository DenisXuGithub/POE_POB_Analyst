<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 前端動態解析測試</title>
  <!-- 載入 unpkg 的 pako.js 確保連線穩定 -->
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 900px; }
    h2 { color: #f0a334; }
    textarea {
      width: 100%;
      height: 120px;
      background: #161b22;
      color: #e1e4e8;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 12px 24px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      float: right;
    }
    button:hover { background: #2ea043; }
    .result {
      width: 100%;
      max-width: 900px;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 20px;
      margin-top: 20px;
      border-radius: 6px;
      display: none;
      box-sizing: border-box;
    }
    .badge { background: #21262d; border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; color: #f0a334; font-size: 13px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PoB 前端自動動態解析測試</h2>
    <textarea id="pobCodeInput" placeholder="請在此貼上 PoB 匯出碼 (eJz...)"></textarea>
    <button type="button" onclick="parseAndAnalyzePoB()">執行全數據解析</button>
  </div>

  <div class="result" id="resultBox">
    <h3 id="resTitle" style="color: #58a6ff;">解析結果</h3>
    <div id="resMeta" style="margin-bottom: 15px;"></div>
    <div id="resBody"></div>
  </div>

  <script>
    function parseAndAnalyzePoB() {
      console.log("解析按鈕已觸發...");
      const rawInput = document.getElementById('pobCodeInput');
      const resultBox = document.getElementById('resultBox');

      if (!rawInput) {
        alert("找不到 pobCodeInput 文字框標籤！");
        return;
      }

      const rawCode = rawInput.value.trim();

      // 檢查 1: pako.js 是否載入成功
      if (typeof pako === 'undefined') {
        alert("系統錯誤：pako.js 程式庫未載入成功，請確認網路連線或 CDN 網址！");
        return;
      }

      // 檢查 2: 是否填寫 PoB 碼
      if (!rawCode) {
        alert("請先在上方輸入框貼上 PoB 匯出碼！");
        return;
      }

      try {
        // Base64 換算與 zlib 解壓縮
        let base64 = rawCode.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        const decompressed = pako.inflate(bytes, { to: 'string' });
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(decompressed, "text/xml");

        // 檢查 XML 解析
        if (xmlDoc.querySelector("parsererror")) {
          throw new Error("XML 解析失敗，貼入的字串非 PoB 有效格式。");
        }

        // 抓取職業與等級
        const buildNode = xmlDoc.querySelector("Build");
        const className = buildNode ? (buildNode.getAttribute("className") || "未知職業") : "未知職業";
        const ascendName = buildNode ? (buildNode.getAttribute("ascendClassName") || "未昇華") : "未昇華";
        const level = buildNode ? (buildNode.getAttribute("level") || "0") : "0";

        // 顯示解析內容
        document.getElementById('resTitle').innerText = `解析成功：${level} 級 ${className} (${ascendName})`;
        document.getElementById('resMeta').innerHTML = `
          <span class="badge">職業：${className}</span>
          <span class="badge">昇華：${ascendName}</span>
          <span class="badge">等級：${level} 級</span>
        `;
        document.getElementById('resBody').innerHTML = `<p style="color: #3fb950;">✔ XML 資料已成功解開！這串 PoB 的核心職業是 <strong>${className}</strong>。</p>`;
        
        resultBox.style.display = 'block';

      } catch (err) {
        console.error("解碼過程發生例外錯誤：", err);
        alert("解碼過程發生錯誤：" + err.message);
      }
    }
  </script>

</body>
</html>
