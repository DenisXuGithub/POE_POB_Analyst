<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 角色深度解析檢視器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0d10;
      color: #e1e4e8;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      background: #161b22;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    h2 { color: #f0a334; margin: 0; font-size: 18px; white-space: nowrap; }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 14px;
    }
    input[type="text"]:focus {
      border-color: #f0a334;
      outline: none;
    }
    button {
      padding: 10px 20px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background-color: #2ea043; }
    .display-frame {
      flex: 1;
      width: 100%;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .placeholder {
      color: #8b949e;
      text-align: center;
      margin-top: 20vh;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h2>PoB 深度解析</h2>
    <input type="text" id="pobInput" placeholder="請貼上 pobb.in 的 Embed 網址 (例如: https://pobb.in/xxxxx/embed)">
    <button onclick="renderPoB()">載入完整面板</button>
  </header>

  <div class="display-frame" id="viewerContainer">
    <div class="placeholder">請於上方輸入完整的 pobb.in Embed 網址，即可在此呈現包含裝備、天賦與詳細數值的完整分析面板。</div>
  </div>

  <script>
    function renderPoB() {
      const inputVal = document.getElementById('pobInput').value.trim();
      const container = document.getElementById('viewerContainer');

      if (!inputVal) {
        alert('請先輸入網址！');
        return;
      }

      // 直接以全版 iframe 載入該分析頁面
      container.innerHTML = `<iframe src="${inputVal}"></iframe>`;
    }
  </script>

</body>
</html>
