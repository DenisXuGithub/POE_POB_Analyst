<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoB 線上分析檢視器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1115;
      color: #e1e4e8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0a334; margin-bottom: 10px; }
    p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    .search-box {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 15px;
    }
    input[type="text"]:focus {
      border-color: #f0a334;
      outline: none;
    }
    button {
      padding: 12px 24px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    button:hover { background-color: #2ea043; }
    .display-frame {
      width: 100%;
      max-width: 1200px;
      height: 85vh;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .placeholder {
      color: #8b949e;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>Path of Building 線上解析檢視器</h2>
  <p class="subtitle">請在下方輸入您的 PoB 匯出碼或 pobb.in 連結，即可立即完整呈現角色面板</p>

  <div class="search-box">
    <input type="text" id="pobInput" placeholder="在此貼上 PoB 匯出碼 (Pastebin Code) 或網址...">
    <button onclick="renderPoB()">載入分析</button>
  </div>

  <div class="display-frame" id="viewerContainer">
    <div class="placeholder">尚無資料，請於上方輸入 PoB 碼並點擊載入。</div>
  </div>

  <script>
    async function renderPoB() {
      const inputVal = document.getElementById('pobInput').value.trim();
      const container = document.getElementById('viewerContainer');

      if (!inputVal) {
        alert('請先輸入有效的 PoB 匯出碼！');
        return;
      }

      container.innerHTML = `<div class="placeholder" style="color: #f0a334;">正在解析 PoB 數據，請稍候...</div>`;

      try {
        // 如果使用者直接貼上網址
        if (inputVal.startsWith('http')) {
          let targetUrl = inputVal;
          // 若是 pobb.in 網址，確保加上嵌入參數以獲得最佳顯示效果
          if (targetUrl.includes('pobb.in') && !targetUrl.endsWith('/embed')) {
            targetUrl = targetUrl.replace(/\/$/, '') + '/embed';
          }
          container.innerHTML = `<iframe src="${targetUrl}"></iframe>`;
          return;
        }

        // 如果使用者貼上的是純 PoB 匯出碼，透過 API 進行解析轉換
        const response = await fetch('https://pobb.in/pob/', {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain',
          },
          body: inputVal
        });

        if (!response.ok) {
          throw new Error('伺服器回應錯誤');
        }

        const data = await response.json();
        
        if (data.url) {
          let embedUrl = data.url;
          if (!embedUrl.endsWith('/embed')) {
            embedUrl = embedUrl.replace(/\/$/, '') + '/embed';
          }
          container.innerHTML = `<iframe src="${embedUrl}"></iframe>`;
        } else {
          throw new Error('無法取得解析後的頁面連結');
        }

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="placeholder" style="color: #f85149;">解析失敗：無法讀取該 PoB 匯出碼，請檢查格式是否正確。</div>`;
      }
    }
  </script>

</body>
</html>
